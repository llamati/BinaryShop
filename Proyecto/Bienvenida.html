<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido a BinaryShop</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #111814 50%, #1b2620 50%);
      color: #e8eee9;
      font-family: "Courier New", monospace;
      text-align: center;
    }

    main {
      width: min(100%, 520px);
      padding: 48px 32px;
      border: 1px solid rgba(216, 184, 90, 0.3);
      border-radius: 24px;
      background: rgba(27, 38, 32, 0.96);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 16px;
      color: #d8b85a;
      font-family: "Times New Roman", serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
    }

    p {
      margin: 0 0 28px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #d8b85a, #c7a84e);
      color: #111814;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(216, 184, 90, 0.3);
    }
  </style>
</head>
<body>
  <main>
    <h1>BinaryShop</h1>
    <p>¡Bienvenido! Explora todo lo que tenemos para ti.</p>
    <a href="HTML/Botones.html">Entrar</a>
  </main>
</body>
</html>
