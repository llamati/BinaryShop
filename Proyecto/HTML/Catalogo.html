<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <!-- Enlace a la hoja de estilos CSS -->
    <link rel="stylesheet" href="catalogo.css">
</head>
<body>

    <!-- Encabezado de la página -->
    <header class="header">
        <div class="container header-content">
            <h1>BinaryShop</h1>
            <div class="header-actions">
                <a class="sell-link" href="Publicar.html">Vender producto</a>
                <button id="history-btn" class="cart-btn" type="button" aria-expanded="false" aria-controls="history-panel">
                    Historial
                </button>
                <button id="cart-btn" class="cart-btn" type="button">
                    🛒 Carrito (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container main-content">
        <!-- Busqueda de productos -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Buscar productos. . ." autocomplete="off">
            <select id="category-select">
            <option value="todos">Todos los articulos</option>
            <option value="tecnologia">Tecnologia</option>
            <option value="ropa">Ropa</option>
            <option value="accesorios">Accesorios</option>
            <option value="otros">Otros</option>
            <option value="digital">Productos digitales</option>
        </select>
        </div>
        <section id="history-panel" class="history-panel" aria-labelledby="history-title" hidden>
            <h2 id="history-title">Historial de <span id="history-username"></span></h2>
            <div class="history-columns">
                <section class="history-column" aria-labelledby="purchase-history-title">
                    <h3 id="purchase-history-title">Mis compras</h3>
                    <ul id="purchase-history" class="history-list"></ul>
                </section>
                <section class="history-column" aria-labelledby="sales-history-title">
                    <h3 id="sales-history-title">Mis ventas</h3>
                    <ul id="sales-history" class="history-list"></ul>
                </section>
            </div>
        </section>
        <!-- Cuadrícula de Productos -->
        <section id="product-grid" class="product-grid">
            <!-- Los productos se inyectarán dinámicamente con JavaScript -->
        </section>
    </main>

    <!-- Panel Lateral del Carrito -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>Tu Carrito de Compras</h2>
                <button id="close-cart" class="close-btn" type="button">&times;</button>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- Los elementos del carrito aparecerán aquí -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-price">$0</span>
                </div>
                <button id="checkout-btn" class="checkout-btn" type="button">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="historial.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
